<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单词宠物园 - 快乐背单词</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --primary:#6C5CE7; --primary-light:#A29BFE; --success:#00B894; --danger:#E17055;
  --warning:#FDCB6E; --bg:#F8F9FE; --card:#FFFFFF; --text:#2D3436; --text-light:#636E72;
  --radius:16px; --shadow:0 4px 15px rgba(108,92,231,0.1);
}
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif; background:var(--bg); color:var(--text); max-width:480px; margin:0 auto; min-height:100vh; position:relative; overflow-x:hidden; }
.page { display:none; padding:16px 16px 90px; animation:fadeIn .3s ease; }
.page.active { display:block; }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
@keyframes pop { 0%{transform:scale(0.8);opacity:0} 100%{transform:scale(1);opacity:1} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
@keyframes confetti { 0%{transform:translateY(0) rotate(0);opacity:1} 100%{transform:translateY(-80px) rotate(360deg);opacity:0} }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
@keyframes petEat { 0%,100%{transform:scale(1) rotate(0)} 25%{transform:scale(1.15) rotate(-6deg)} 50%{transform:scale(0.95) rotate(0)} 75%{transform:scale(1.12) rotate(6deg)} }
@keyframes petJump { 0%,100%{transform:translateY(0) scale(1)} 30%{transform:translateY(-28px) scale(1.05)} 50%{transform:translateY(0) scale(0.95,1.05)} 65%{transform:translateY(-12px)} 80%{transform:translateY(0)} }
@keyframes petSpin { 0%{transform:rotate(0) scale(1)} 50%{transform:rotate(180deg) scale(1.2)} 100%{transform:rotate(360deg) scale(1)} }
@keyframes petWiggle { 0%,100%{transform:rotate(0)} 20%{transform:rotate(-8deg)} 40%{transform:rotate(8deg)} 60%{transform:rotate(-6deg)} 80%{transform:rotate(6deg)} }
@keyframes petSleep { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(2px) scale(1.02,0.98)} }
@keyframes particleUp { 0%{transform:translateY(0) scale(0.6);opacity:0} 20%{opacity:1;transform:translateY(-14px) scale(1)} 100%{transform:translateY(-70px) scale(1.1);opacity:0} }
@keyframes foodFly { 0%{transform:translate(70px,-60px) scale(0.5) rotate(0);opacity:0} 30%{opacity:1} 100%{transform:translate(0,0) scale(1) rotate(-30deg);opacity:0} }
@keyframes zzz { 0%{transform:translateY(0);opacity:0} 30%{opacity:1} 100%{transform:translateY(-30px);opacity:0} }
.pet-emoji.anim-eat { animation:petEat .7s ease 2; }
.pet-emoji.anim-jump { animation:petJump .8s ease 2; }
.pet-emoji.anim-spin { animation:petSpin .8s ease 1; }
.pet-emoji.anim-wiggle { animation:petWiggle .6s ease 2; }
.pet-emoji.anim-sleep { animation:petSleep 2.5s ease-in-out infinite; }
.pet-particle { position:absolute; font-size:20px; animation:particleUp 1s ease forwards; pointer-events:none; }
.pet-food { position:absolute; font-size:26px; animation:foodFly .7s ease forwards; pointer-events:none; }
.speak-btn { border:none; background:#F0EDFF; color:var(--primary); width:38px; height:38px; border-radius:50%; font-size:18px; cursor:pointer; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; }
.speak-btn:active { transform:scale(0.9); background:var(--primary); color:#fff; }
.word-emoji { font-size:64px; line-height:1; margin-bottom:10px; animation:pop .4s ease; }
.memorize-box { margin-top:14px; padding:14px; background:#F0FFF9; border:1.5px dashed #00B894; border-radius:14px; text-align:center; animation:pop .3s ease; }
.spell-slots { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:16px 0; }
.spell-slot { width:34px; height:42px; border:2px dashed #DFE6E9; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; color:var(--primary); background:#FAFAFE; text-transform:lowercase; }
.spell-slot.filled { border-style:solid; border-color:var(--primary-light); background:#F0EDFF; animation:pop .2s ease; }
.spell-slot.ok { border-color:var(--success); background:#E8FFF8; color:var(--success); }
.spell-slot.bad { border-color:var(--danger); background:#FFF0ED; color:var(--danger); animation:shake .3s; }
.letter-bank { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:8px; }
.letter-tile { width:40px; height:44px; border:2px solid #E8E6FF; border-bottom-width:4px; border-radius:12px; background:#fff; font-size:19px; font-weight:700; color:var(--primary); cursor:pointer; text-transform:lowercase; transition:all .1s; }
.letter-tile:active { transform:translateY(2px); border-bottom-width:2px; }
.letter-tile.used { opacity:0.15; pointer-events:none; }

/* Header */
.header { display:flex; align-items:center; justify-content:space-between; padding:8px 0 16px; }
.header h1 { font-size:20px; background:linear-gradient(135deg,var(--primary),#E84393); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.points-badge { display:flex; align-items:center; gap:4px; background:linear-gradient(135deg,#FFEAA7,#FDCB6E); padding:6px 12px; border-radius:20px; font-size:14px; font-weight:700; color:#D68910; }

/* Cards */
.card { background:var(--card); border-radius:var(--radius); padding:20px; margin-bottom:14px; box-shadow:var(--shadow); }
.card-title { font-size:15px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px; }

/* Today Plan */
.plan-item { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid #F1F2F6; }
.plan-item:last-child { border:none; }
.plan-info { display:flex; align-items:center; gap:12px; }
.plan-icon { width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; }
.plan-btn { padding:8px 16px; border:none; border-radius:20px; font-size:13px; font-weight:600; color:#fff; cursor:pointer; }
.plan-btn.learn { background:linear-gradient(135deg,var(--primary),var(--primary-light)); }
.plan-btn.review { background:linear-gradient(135deg,#00B894,#55EFC4); }
.plan-btn.done { background:#DFE6E9; color:#B2BEC3; }

/* Streak */
.streak-bar { display:flex; align-items:center; gap:10px; background:linear-gradient(135deg,#6C5CE7,#A29BFE); border-radius:var(--radius); padding:14px 18px; color:#fff; margin-bottom:14px; }
.streak-num { font-size:28px; font-weight:800; }
.streak-dots { display:flex; gap:5px; margin-left:auto; }
.streak-dot { width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,0.3); }
.streak-dot.on { background:#FFEAA7; }

/* Progress */
.progress-track { height:8px; background:#F1F2F6; border-radius:4px; overflow:hidden; margin-top:8px; }
.progress-fill { height:100%; border-radius:4px; background:linear-gradient(90deg,var(--primary),#E84393); transition:width .5s ease; }

/* Learn Card */
.word-card { text-align:center; padding:30px 20px; min-height:260px; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; }
.word-en { font-size:36px; font-weight:800; color:var(--primary); margin-bottom:8px; }
.word-phonetic { font-size:14px; color:var(--text-light); margin-bottom:16px; }
.word-cn { font-size:22px; font-weight:600; padding:10px 24px; background:#F8F9FE; border-radius:12px; }
.word-cn.hidden-word { filter:blur(8px); user-select:none; }
.word-topic { position:absolute; top:14px; left:18px; font-size:12px; background:#F0EDFF; color:var(--primary); padding:4px 10px; border-radius:10px; }
.word-counter { position:absolute; top:14px; right:18px; font-size:12px; color:var(--text-light); }
.word-actions { display:flex; gap:12px; margin-top:16px; }
.btn-know { flex:1; padding:14px; border:none; border-radius:14px; font-size:16px; font-weight:700; cursor:pointer; transition:transform .1s; }
.btn-know:active { transform:scale(0.96); }
.btn-know.yes { background:linear-gradient(135deg,#00B894,#55EFC4); color:#fff; }
.btn-know.no { background:linear-gradient(135deg,#E17055,#FAB1A0); color:#fff; }
.btn-show { padding:12px 32px; border:2px solid var(--primary); background:#fff; color:var(--primary); border-radius:14px; font-size:15px; font-weight:600; cursor:pointer; }

/* Quiz */
.quiz-option { display:block; width:100%; padding:15px 18px; margin-bottom:10px; border:2px solid #F1F2F6; border-radius:14px; background:#fff; font-size:16px; text-align:left; cursor:pointer; transition:all .2s; }
.quiz-option:active { transform:scale(0.98); }
.quiz-option.correct { border-color:var(--success); background:#E8FFF8; }
.quiz-option.wrong { border-color:var(--danger); background:#FFF0ED; animation:shake .3s; }
.quiz-option.disabled { pointer-events:none; }
.quiz-prompt { font-size:28px; font-weight:800; text-align:center; padding:24px 0; color:var(--primary); }
.quiz-type-tag { text-align:center; font-size:12px; color:var(--text-light); margin-bottom:8px; }

/* Spell */
.spell-input { width:100%; padding:14px 18px; border:2px solid #DFE6E9; border-radius:14px; font-size:20px; text-align:center; letter-spacing:2px; outline:none; transition:border-color .2s; }
.spell-input:focus { border-color:var(--primary); }
.spell-input.correct { border-color:var(--success); background:#E8FFF8; }
.spell-input.wrong { border-color:var(--danger); background:#FFF0ED; }
.spell-hint { text-align:center; margin-top:10px; font-size:14px; color:var(--text-light); }
.spell-check-btn { width:100%; margin-top:14px; padding:14px; border:none; border-radius:14px; background:linear-gradient(135deg,var(--primary),var(--primary-light)); color:#fff; font-size:16px; font-weight:700; cursor:pointer; }

/* Result */
.result-circle { width:120px; height:120px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; margin:20px auto; font-size:32px; font-weight:800; color:#fff; }
.result-detail { text-align:center; color:var(--text-light); font-size:14px; margin-bottom:16px; }
.result-points { text-align:center; font-size:18px; font-weight:700; color:#D68910; margin-bottom:20px; animation:pop .4s ease; }
.big-btn { display:block; width:100%; padding:15px; border:none; border-radius:14px; font-size:16px; font-weight:700; color:#fff; background:linear-gradient(135deg,var(--primary),var(--primary-light)); cursor:pointer; margin-bottom:10px; }
.big-btn.secondary { background:#F1F2F6; color:var(--text); }

/* Word Book */
.filter-row { display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; -webkit-overflow-scrolling:touch; }
.filter-chip { flex-shrink:0; padding:7px 14px; border-radius:16px; border:1.5px solid #DFE6E9; background:#fff; font-size:13px; cursor:pointer; }
.filter-chip.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.wb-item { display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid #F1F2F6; }
.wb-word { font-weight:600; font-size:15px; }
.wb-mean { font-size:13px; color:var(--text-light); margin-top:2px; }
.wb-status { font-size:11px; padding:4px 10px; border-radius:10px; flex-shrink:0; }
.wb-status.new { background:#F0EDFF; color:var(--primary); }
.wb-status.learning { background:#FFF3CD; color:#D68910; }
.wb-status.mastered { background:#D4EFDF; color:#27AE60; }
.search-box { width:100%; padding:12px 16px; border:2px solid #F1F2F6; border-radius:14px; font-size:15px; outline:none; margin-bottom:12px; background:#fff; }
.search-box:focus { border-color:var(--primary-light); }

/* Pet */
.pet-stage { text-align:center; padding:20px 0; position:relative; }
.pet-emoji { font-size:80px; animation:float 3s ease-in-out infinite; display:inline-block; cursor:pointer; }
.pet-emoji:active { animation:bounce .5s; }
.pet-name { font-size:18px; font-weight:700; margin-top:8px; }
.pet-level { font-size:13px; color:var(--text-light); }
.pet-status-msg { font-size:14px; margin-top:8px; padding:8px 16px; background:#F8F9FE; border-radius:12px; display:inline-block; }
.stat-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.stat-label { font-size:13px; width:45px; flex-shrink:0; }
.stat-bar { flex:1; height:10px; background:#F1F2F6; border-radius:5px; overflow:hidden; }
.stat-fill { height:100%; border-radius:5px; transition:width .5s ease; }
.stat-fill.hunger { background:linear-gradient(90deg,#FDCB6E,#E17055); }
.stat-fill.mood { background:linear-gradient(90deg,#55EFC4,#00B894); }
.stat-val { font-size:12px; color:var(--text-light); width:32px; text-align:right; }
.pet-actions { display:flex; gap:10px; margin-top:16px; }
.pet-action-btn { flex:1; padding:12px 8px; border:none; border-radius:14px; font-size:13px; font-weight:600; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; }
.pet-action-btn .cost { font-size:11px; opacity:.8; }
.pet-action-btn.feed { background:linear-gradient(135deg,#FFEAA7,#FDCB6E); color:#D68910; }
.pet-action-btn.play { background:linear-gradient(135deg,#DFE6E9,#B2BEC3); color:#2D3436; }
.pet-action-btn.gift { background:linear-gradient(135deg,#FD79A8,#E84393); color:#fff; }
.pet-action-btn:disabled { opacity:.4; }

/* Pet Shop */
.shop-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.shop-item { background:#fff; border-radius:var(--radius); padding:18px 12px; text-align:center; box-shadow:var(--shadow); border:2px solid transparent; transition:all .2s; }
.shop-item.owned { border-color:var(--success); }
.shop-emoji { font-size:44px; margin-bottom:8px; }
.shop-name { font-size:14px; font-weight:700; }
.shop-price { font-size:12px; color:#D68910; margin-top:4px; }
.shop-btn { margin-top:10px; padding:8px 20px; border:none; border-radius:12px; font-size:13px; font-weight:600; cursor:pointer; background:linear-gradient(135deg,var(--primary),var(--primary-light)); color:#fff; }
.shop-btn:disabled { background:#DFE6E9; color:#B2BEC3; }
.shop-btn.select { background:linear-gradient(135deg,#00B894,#55EFC4); }

/* Grammar */
.grammar-card { cursor:pointer; transition:transform .15s; }
.grammar-card:active { transform:scale(0.98); }
.grammar-title { font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; }
.grammar-tag { font-size:11px; padding:3px 8px; border-radius:8px; background:#F0EDFF; color:var(--primary); }
.grammar-body { display:none; margin-top:14px; padding-top:14px; border-top:1px solid #F1F2F6; font-size:14px; line-height:1.8; color:#2D3436; }
.grammar-body.open { display:block; animation:fadeIn .3s; }
.grammar-example { background:#F8F9FE; border-left:3px solid var(--primary); padding:10px 14px; border-radius:0 10px 10px 0; margin:8px 0; font-size:14px; }
.grammar-example b { color:var(--primary); }

/* Bottom Nav */
.bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:#fff; display:flex; padding:8px 0 calc(8px + env(safe-area-inset-bottom)); box-shadow:0 -2px 20px rgba(0,0,0,0.06); z-index:100; }
.nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; color:#B2BEC3; cursor:pointer; padding:4px 0; border:none; background:none; position:relative; }
.nav-item.active { color:var(--primary); font-weight:600; }
.nav-icon { font-size:22px; }
.nav-badge { position:absolute; top:0; right:50%; transform:translateX(14px); background:var(--danger); color:#fff; font-size:10px; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:700; }

/* Settings */
.setting-row { display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid #F1F2F6; }
.setting-label { font-size:15px; }
.stepper { display:flex; align-items:center; gap:12px; }
.stepper button { width:30px; height:30px; border:none; border-radius:10px; background:#F0EDFF; color:var(--primary); font-size:18px; font-weight:700; cursor:pointer; }
.stepper span { font-size:16px; font-weight:700; min-width:24px; text-align:center; }
.danger-btn { width:100%; padding:14px; border:2px solid var(--danger); background:#fff; color:var(--danger); border-radius:14px; font-size:15px; font-weight:600; cursor:pointer; margin-top:20px; }

/* Toast */
.toast { position:fixed; top:60px; left:50%; transform:translateX(-50%); background:#2D3436; color:#fff; padding:10px 24px; border-radius:20px; font-size:14px; z-index:999; animation:pop .3s ease; display:none; }
.toast.show { display:block; }
.points-fly { position:fixed; z-index:998; font-size:18px; font-weight:800; color:#D68910; animation:confetti 1s ease forwards; pointer-events:none; }

/* Setup */
.setup-overlay { position:fixed; inset:0; background:linear-gradient(135deg,#6C5CE7,#A29BFE); z-index:200; display:flex; align-items:center; justify-content:center; padding:24px; }
.setup-card { background:#fff; border-radius:24px; padding:32px 24px; width:100%; max-width:360px; text-align:center; animation:pop .4s ease; }
.setup-card h2 { font-size:22px; margin-bottom:6px; }
.setup-card p { font-size:14px; color:var(--text-light); margin-bottom:20px; }
.setup-input { width:100%; padding:14px 18px; border:2px solid #F1F2F6; border-radius:14px; font-size:16px; text-align:center; outline:none; margin-bottom:16px; }
.setup-input:focus { border-color:var(--primary-light); }
.grade-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
.grade-opt { padding:12px; border:2px solid #F1F2F6; border-radius:14px; font-size:14px; font-weight:600; cursor:pointer; background:#fff; }
.grade-opt.active { border-color:var(--primary); background:#F0EDFF; color:var(--primary); }
.tab-row { display:flex; gap:8px; margin-bottom:14px; }
.tab-btn { flex:1; padding:9px; border:none; border-radius:12px; font-size:13px; font-weight:600; background:#F1F2F6; color:var(--text-light); cursor:pointer; }
.tab-btn.active { background:var(--primary); color:#fff; }
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- Setup -->
<div id="setupOverlay" class="setup-overlay" style="display:none">
  <div class="setup-card">
    <h2>单词宠物园</h2>
    <p>每天背几个单词，养一只可爱的小宠物吧！</p>
    <input id="setupName" class="setup-input" placeholder="输入你的名字" maxlength="8">
    <div class="grade-grid" id="gradeGrid"></div>
    <button class="big-btn" onclick="finishSetup()">开始学习之旅</button>
  </div>
</div>

<!-- Home -->
<div id="page-home" class="page active">
  <div class="header">
    <h1>单词宠物园</h1>
    <div class="points-badge">⭐ <span id="homePoints">0</span></div>
  </div>
  <div class="streak-bar">
    <div><div class="streak-num" id="streakNum">0</div><div style="font-size:12px;opacity:.85">连续学习天数</div></div>
    <div class="streak-dots" id="streakDots"></div>
  </div>
  <div class="card">
    <div class="card-title">📋 今日任务</div>
    <div id="todayPlan"></div>
  </div>
  <div class="card">
    <div class="card-title">📊 学习进度</div>
    <div style="font-size:13px;color:var(--text-light)" id="progressText"></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <div class="card" style="text-align:center;cursor:pointer" onclick="switchPage('pet')">
    <div id="homePetPreview" style="font-size:48px;animation:float 3s ease-in-out infinite"></div>
    <div style="font-size:13px;color:var(--text-light);margin-top:6px" id="homePetMsg"></div>
  </div>
</div>

<!-- Learn -->
<div id="page-learn" class="page">
  <div class="header"><h1>学习新词</h1><div class="points-badge">⭐ <span class="pts-display">0</span></div></div>
  <div id="learnArea"></div>
</div>

<!-- Review -->
<div id="page-review" class="page">
  <div class="header"><h1>复习巩固</h1><div class="points-badge">⭐ <span class="pts-display">0</span></div></div>
  <div id="reviewArea"></div>
</div>

<!-- Test -->
<div id="page-test" class="page">
  <div class="header"><h1>单词测试</h1><div class="points-badge">⭐ <span class="pts-display">0</span></div></div>
  <div id="testArea"></div>
</div>

<!-- Word Book -->
<div id="page-book" class="page">
  <div class="header"><h1>单词本</h1><div class="points-badge">⭐ <span class="pts-display">0</span></div></div>
  <input class="search-box" id="bookSearch" placeholder="搜索单词或中文..." oninput="renderBook()">
  <div class="filter-row" id="bookFilters"></div>
  <div class="card" id="bookList"></div>
</div>

<!-- Grammar -->
<div id="page-grammar" class="page">
  <div class="header"><h1>语法知识</h1><div class="points-badge">⭐ <span class="pts-display">0</span></div></div>
  <div class="tab-row" id="grammarTabs"></div>
  <div id="grammarList"></div>
</div>

<!-- Pet -->
<div id="page-pet" class="page">
  <div class="header"><h1>我的宠物</h1><div class="points-badge">⭐ <span class="pts-display">0</span></div></div>
  <div class="tab-row">
    <button class="tab-btn active" onclick="showPetTab('main',this)">我的宠物</button>
    <button class="tab-btn" onclick="showPetTab('shop',this)">宠物商店</button>

{g:3,tag:"句型",title:"be动词用法 (am/is/are)",body:"<b>I</b> 用 am，<b>you</b> 用 are，<b>he/she/it</b> 用 is，复数全用 are。<div class='grammar-example'>I <b>am</b> a student. 我是一名学生。<br>She <b>is</b> my teacher. 她是我的老师。<br>They <b>are</b> my friends. 他们是我的朋友。</div>口诀：我用am，你用are，is连着他她它，复数全部都用are。"},
{g:3,tag:"句型",title:"打招呼与自我介绍",body:"见面打招呼用 Hello!/Hi! 询问名字用 <b>What's your name?</b><div class='grammar-example'><b>What's your name?</b> 你叫什么名字？<br><b>My name is Sam.</b> 我叫Sam。<br><b>Nice to meet you!</b> 很高兴见到你！<br><b>How are you?</b> — <b>I'm fine, thank you.</b></div>"},
{g:3,tag:"句型",title:"询问物品 What's this/that?",body:"<b>What's this?</b> 这是什么？（近处）<br><b>What's that?</b> 那是什么？（远处）<div class='grammar-example'>What's this? — <b>It's a book.</b> 这是一本书。<br>What's that? — <b>It's a bird.</b> 那是一只鸟。</div>注意：回答都用 It's...，不用 This is/That is。"},
{g:3,tag:"句型",title:"表达喜好 I like...",body:"喜欢用 <b>like</b>，后面可以加名词或动词ing。<div class='grammar-example'>I <b>like</b> apples. 我喜欢苹果。<br>I <b>like swimming</b>. 我喜欢游泳。<br>I <b>don't like</b> bananas. 我不喜欢香蕉。<br><b>Do you like</b> music? — Yes, I do. / No, I don't.</div>"},
{g:3,tag:"句型",title:"祈使句（表示命令请求）",body:"祈使句以动词原形开头，表示\"请做...\"或\"不要做...\"。<div class='grammar-example'><b>Stand up</b>, please. 请起立。<br><b>Open</b> your book. 打开你的书。<br><b>Don't run</b> in the classroom. 不要在教室里跑。<br><b>Let's</b> play football. 我们去踢足球吧。</div>"},
{g:4,tag:"时态",title:"一般现在时",body:"表示经常做的事或客观事实。主语是<b>第三人称单数</b>（he/she/it）时，动词要加s/es。<div class='grammar-example'>I <b>go</b> to school at 7:30. 我7:30上学。<br>He <b>goes</b> to school by bus. 他坐公交上学。<br>She <b>likes</b> English. 她喜欢英语。<br>The sun <b>rises</b> in the east. 太阳从东方升起。</div>变否定：don't / doesn't + 动词原形<br>变疑问：Do/Does + 主语 + 动词原形？"},
{g:4,tag:"时态",title:"现在进行时 (be + doing)",body:"表示<b>正在</b>做的事。结构：am/is/are + 动词ing。<div class='grammar-example'>I <b>am reading</b> a book. 我正在读书。<br>They <b>are playing</b> football. 他们正在踢足球。<br>She <b>is singing</b> a song. 她正在唱歌。</div>标志词：now, look!, listen!, at the moment<br>动词变ing规则：直接加ing；去e加ing（make→making）；双写加ing（run→running, swim→swimming）"},
{g:4,tag:"句型",title:"There be 句型",body:"表示\"某地有某物\"。<b>There is</b> + 单数/不可数名词，<b>There are</b> + 复数名词。<div class='grammar-example'><b>There is</b> a park near my home. 我家附近有个公园。<br><b>There are</b> many birds in the tree. 树上有很多鸟。<br><b>Is there</b> a library in your school? 你们学校有图书馆吗？<br><b>How many</b> books are there? 有多少本书？</div>就近原则：There is a pen and two books.（pen最近用is）"},
{g:4,tag:"句型",title:"询问价格与数量",body:"<b>How much</b> 问价格（不可数）；<b>How many</b> 问数量（可数复数）。<div class='grammar-example'><b>How much</b> is this shirt? — It's 50 yuan.<br><b>How many</b> people are there in your family? — There are four.</div>"},
{g:4,tag:"句型",title:"询问方位与问路",body:"<b>Where is...?</b> 在哪里？用介词回答方位。<div class='grammar-example'><b>Where is</b> the hospital? 医院在哪？<br>It's <b>next to</b> the park. 在公园旁边。<br><b>Excuse me</b>, how can I get to the station? 请问怎么去车站？<br><b>Go straight</b> and <b>turn left</b>. 直走然后左转。</div>方位词：in, on, under, behind, near, beside, between, in front of"},
{g:5,tag:"时态",title:"一般过去时",body:"表示<b>过去</b>发生的事。动词用过去式。<div class='grammar-example'>I <b>went</b> to the zoo yesterday. 我昨天去了动物园。<br>She <b>bought</b> a new dress last week. 她上周买了条新裙子。<br>We <b>had</b> a good time. 我们玩得很开心。</div>规则变化：加ed（played, visited）；e结尾加d（liked, lived）；辅+y变i加ed（studied）；重读闭音节双写加ed（stopped）<br>常见不规则：go→went, see→saw, eat→ate, buy→bought, take→took, make→made, get→got, have→had, do→did, come→came<br>标志词：yesterday, last..., ...ago, just now"},
{g:5,tag:"时态",title:"一般将来时 (be going to / will)",body:"表示<b>将要</b>发生的事。<div class='grammar-example'>I <b>am going to visit</b> my grandma tomorrow. 我明天要去看望奶奶。<br>It <b>will</b> rain tomorrow. 明天会下雨。<br>We <b>are going to have</b> a picnic. 我们要去野餐。</div>标志词：tomorrow, next..., soon, this weekend<br>疑问句：Are you going to...? / Will you...?<br>回答：Yes, I am. / No, I won't."},
{g:5,tag:"语法",title:"形容词比较级和最高级",body:"两者比较用<b>比较级 + than</b>；三者以上用<b>the + 最高级</b>。<div class='grammar-example'>Tom is <b>taller than</b> Jerry. 汤姆比杰瑞高。<br>This book is <b>more interesting than</b> that one. 这本书比那本有趣。<br>She is <b>the best</b> student in our class. 她是班里最好的学生。</div>变化规则：短词加er/est（tall→taller→tallest）；e结尾加r/st（nice→nicer）；辅+y变i加er/est（happy→happier）；多音节用more/most（beautiful→more beautiful）<br>特殊：good→better→best, bad→worse→worst, many/much→more→most"},
{g:5,tag:"语法",title:"情态动词 must / should / can",body:"情态动词后面加<b>动词原形</b>。<div class='grammar-example'>You <b>must stop</b> at the red light. 红灯必须停。<br>You <b>shouldn't play</b> on the street. 不应该在街上玩。<br><b>Can</b> you swim? — Yes, I <b>can</b>. / No, I <b>can't</b>.<br>We <b>must keep</b> quiet in the library. 图书馆里必须保持安静。</div>must=必须（强制）should=应该（建议）can=能够（能力/许可）"},
{g:5,tag:"句型",title:"频率副词的位置",body:"always, usually, often, sometimes, never 放在<b>be动词后、实义动词前</b>。<div class='grammar-example'>He <b>is always</b> late. 他总是迟到。（be后）<br>I <b>usually get up</b> at 6:30. 我通常6:30起床。（实义动词前）<br>She <b>never eats</b> junk food. 她从不吃垃圾食品。</div>频率排序：always(100%) > usually(80%) > often(60%) > sometimes(40%) > never(0%)"},
{g:6,tag:"时态",title:"现在完成时 (have/has + done)",body:"表示过去发生但对现在有影响的事，或从过去持续到现在的状态。<div class='grammar-example'>I <b>have read</b> this book twice. 这本书我读过两遍。<br>She <b>has lived</b> here for ten years. 她在这里住了十年。<br><b>Have</b> you <b>ever been</b> to Beijing? 你去过北京吗？<br>I <b>have just finished</b> my homework. 我刚做完作业。</div>标志词：already, yet, just, ever, never, for+时间段, since+时间点<br>注意：have been to(去过已回) vs have gone to(去了未回)"},
{g:6,tag:"语法",title:"被动语态 (be + done)",body:"当主语是动作的<b>承受者</b>时用被动语态。结构：be + 过去分词。<div class='grammar-example'>English <b>is spoken</b> all over the world. 全世界都说英语。<br>The bridge <b>was built</b> in 1990. 这座桥建于1990年。<br>Trees <b>must be planted</b> every year. 每年都必须种树。</div>主动变被动：宾语变主语 + be(根据时态变化) + 过去分词 + by + 原主语"},
{g:6,tag:"语法",title:"条件状语从句 (if)",body:"if 引导条件句，<b>主将从现</b>：主句用将来时，if从句用一般现在时。<div class='grammar-example'><b>If</b> it rains tomorrow, we <b>will stay</b> at home. 如果明天下雨，我们就待在家。<br>I <b>will help</b> you <b>if</b> you need me. 如果你需要我，我会帮你。<br><b>If</b> you study hard, you <b>will pass</b> the exam. 如果努力学习，你会通过考试。</div>注意：if从句中不用will！"},
{g:6,tag:"语法",title:"宾语从句",body:"一个句子作宾语。注意<b>语序用陈述句</b>，时态要呼应。<div class='grammar-example'>I think <b>(that) he is right</b>. 我认为他是对的。<br>Do you know <b>where he lives</b>? 你知道他住哪吗？<br>She asked me <b>if I was OK</b>. 她问我是否还好。<br>Can you tell me <b>how I can get there</b>? 你能告诉我怎么去那吗？</div>三要素：引导词(that/if/whether/疑问词) + 陈述语序 + 时态呼应"},
{g:6,tag:"语法",title:"不定式与动名词 (to do / doing)",body:"有些动词后接 <b>to do</b>，有些接 <b>doing</b>。<div class='grammar-example'>want/decide/hope/plan + <b>to do</b>：<br>I want <b>to be</b> a scientist. 我想当科学家。<br>enjoy/finish/practice + <b>doing</b>：<br>I enjoy <b>reading</b>. 我喜欢阅读。<br>stop <b>to do</b>(停下来去做) vs stop <b>doing</b>(停止正在做的)</div>常考：like doing(习惯爱好) / like to do(某次想做)"},
{g:6,tag:"句型",title:"感叹句 (What/How)",body:"<b>What</b> + (a/an) + 形容词 + 名词！<b>How</b> + 形容词/副词！<div class='grammar-example'><b>What a</b> beautiful flower! 多美的花啊！<br><b>What</b> good news! 多好的消息啊！(不可数不加a)<br><b>How</b> fast he runs! 他跑得多快啊！<br><b>How</b> time flies! 时间过得真快！</div>技巧：看中心词——名词用What，形容词/副词用How。"}

const INTERVALS = [0, 1, 2, 4, 7, 15, 30]; // 各等级复习间隔(天)

// ==================== 音频引擎 ====================
let audioCtx=null;
function getAudio(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
function tone(freq,dur,type,vol,delay){
  const ctx=getAudio(); if(!ctx) return;
  const t=ctx.currentTime+(delay||0);
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t+dur+0.02);
}
const SFX={

  correct(){ tone(660,0.1,'sine',0.18); tone(880,0.12,'sine',0.18,0.09); tone(1100,0.16,'sine',0.16,0.18); },

  feed(){ tone(300,0.08,'sine',0.2); tone(240,0.08,'sine',0.2,0.1); tone(300,0.08,'sine',0.2,0.2); },
  play(){ tone(523,0.09,'triangle',0.16); tone(659,0.09,'triangle',0.16,0.09); tone(784,0.12,'triangle',0.16,0.18); },
  levelup(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.14,'triangle',0.16,i*0.1)); },

};

let ttsReady=false, ttsVoices=[];
function loadVoices(){ ttsVoices=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en')); ttsReady=ttsVoices.length>0; }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function speak(text){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.85; u.pitch=1;
    const en=ttsVoices.find(v=>v.lang==='en-US')||ttsVoices[0];
    if(en) u.voice=en;
    speechSynthesis.speak(u);
  }catch(e){}
}

// ==================== 词库工具 ====================
function allWordsForGrade(g){
  const grades = g<=4 ? [3,4] : g<=5 ? [3,4,5] : [3,4,5,6];
  let list=[];
  grades.forEach(gg=>{
    (WORDS["g"+gg]||[]).forEach((w,i)=> list.push({key:"g"+gg+"_w"+i, en:w[0], cn:w[1], grade:gg, type:"word"}));
    (PHRASES["g"+gg]||[]).forEach((p,i)=> list.push({key:"g"+gg+"_p"+i, en:p[0], cn:p[1], grade:gg, type:"phrase"}));
  });
  return list;
}
function wordStatus(key){
  const w=S.words[key];
  if(!w) return "new";
  if(w.lv>=INTERVALS.length-1) return "mastered";
  return "learning";
}
function getNewWords(count){
  const all=allWordsForGrade(S.grade);
  // 乱序混排：简单词和复杂词穿插，避免从三年级全部学起
  return shuffle(all.filter(w=>!S.words[w.key])).slice(0,count);
}
function getReviewWords(){
  const today=todayStr();
  const all=allWordsForGrade(S.grade);
  return all.filter(w=>{ const s=S.words[w.key]; return s && s.lv<INTERVALS.length-1 && s.next<=today; });
}
function markStudied(){
  const today=todayStr();
  if(S.lastStudyDate!==today){
    const yesterday=dateOffset(-1);
    S.streak = (S.lastStudyDate===yesterday) ? S.streak+1 : 1;
    S.lastStudyDate=today;
    if(!S.studyDays.includes(today)){ S.studyDays.push(today); if(S.studyDays.length>60) S.studyDays.shift(); }
  }
}
function addPoints(n){
  S.points+=n; S.totalPoints+=n;
  showPointsFly("+"+n);
  updatePointsDisplay();
}
function recordAnswer(key, correct){
  if(!S.words[key]) S.words[key]={lv:0,next:todayStr(),learned:todayStr(),correct:0,wrong:0};
  const w=S.words[key];
  if(correct){ w.correct++; w.lv=Math.min(w.lv+1, INTERVALS.length-1); w.next=dateOffset(INTERVALS[w.lv]); }
  else { w.wrong++; w.lv=Math.max(0,w.lv-1); w.next=dateOffset(1); }
}

// ==================== 宠物逻辑 ====================
function petDecay(){
  const p=S.pets; if(!p.owned.length) return;
  const today=todayStr();
  if(p.lastFed && p.lastFed!==today){
    const days=(new Date(today)-new Date(p.lastFed))/86400000;
    p.hunger=Math.max(0, p.hunger-days*15);
    p.mood=Math.max(0, p.mood-days*12);
  }
  if(!p.lastFed) p.lastFed=today;
}
function feedPet(cost){
  if(S.points<cost){ showToast("积分不够哦，快去背单词吧！"); SFX.wrong(); return; }
  S.points-=cost;
  S.pets.hunger=Math.min(100,S.pets.hunger+25);
  S.pets.exp+=10;
  S.pets.lastFed=todayStr();
  checkPetLevel();
  saveState(); updatePointsDisplay(); renderPet();
  SFX.feed();
  petAnim("anim-eat"); spawnFood(); spawnParticles(["😋","✨","💛"],3);
  showToast("宠物吃得很开心！+10经验");
}
function playWithPet(){
  S.pets.mood=Math.min(100,S.pets.mood+15);
  S.pets.exp+=5;
  checkPetLevel();
  saveState(); renderPet();
  SFX.play();
  petAnim("anim-jump"); spawnParticles(["❤️","🎾","😄"],4);
  showToast("和宠物玩耍，心情+15！");
}
function giftPet(){
  if(S.points<20){ showToast("需要20积分买礼物哦！"); SFX.wrong(); return; }
  S.points-=20;
  S.pets.mood=Math.min(100,S.pets.mood+30);
  S.pets.hunger=Math.min(100,S.pets.hunger+10);
  S.pets.exp+=20;
  checkPetLevel();
  saveState(); updatePointsDisplay(); renderPet();
  SFX.coin(); 
  petAnim("anim-spin"); spawnParticles(["🎁","✨","💖","🌟"],5);
  showToast("宠物收到礼物，超级开心！+20经验");
}
function checkPetLevel(){
  const p=S.pets;
  const need=p.level*50;
  if(p.exp>=need){ p.exp-=need; p.level++; SFX.levelup(); showToast("恭喜！宠物升到了"+p.level+"级！"); }
}
function petStudyReward(){
  S.pets.hunger=Math.min(100,S.pets.hunger+8);
  S.pets.mood=Math.min(100,S.pets.mood+5);
  S.pets.exp+=8;
  S.pets.lastFed=todayStr();
  checkPetLevel();
}
// 宠物动画辅助
function petAnim(cls){
  const el=document.querySelector("#petMain .pet-emoji");
  if(!el) return;
  el.classList.remove("anim-eat","anim-jump","anim-spin","anim-wiggle","anim-sleep");

function spawnParticles(emojis,n){

function spawnFood(){

function petStatusMsg(){
  const p=S.pets;
  if(p.hunger<20) return "好饿呀...快喂我吃东西吧 🥺";
  if(p.mood<20) return "好无聊...陪我玩一会儿嘛 😢";

function petEmoji(){

}

}
function learnAnswer(btn, chosen, correctKey){
  const w=learnQueue[learnIdx];
  const isCorrect=chosen===correctKey;
  const opts=document.querySelectorAll("#learnOptions .quiz-option");
  opts.forEach(o=>o.classList.add("disabled"));
  if(isCorrect){
    btn.classList.add("correct");
    SFX.correct();
    learnCorrectCount++;
    // 一次答对=认识，记忆等级直接到2(4天后复习)
    if(!S.words[w.key]) S.words[w.key]={lv:0,next:todayStr(),learned:todayStr(),correct:0,wrong:0};
    S.words[w.key].correct++; S.words[w.key].lv=2; S.words[w.key].next=dateOffset(INTERVALS[2]);
    addPoints(3);
    markStudied(); petStudyReward(); saveState();
    setTimeout(()=>{ learnIdx++; showLearnCard(); },700);
  } else {
    btn.classList.add("wrong");
    SFX.wrong();
    // 标出正确答案
    const all=allWordsForGrade(S.grade);
    const cw=all.find(x=>x.key===correctKey);
    opts.forEach(o=>{ if(o.textContent===cw.cn) o.classList.add("correct"); });
    // 不认识=需要重点记忆，明天复习，并插回队列稍后再出现一次
    if(!S.words[w.key]) S.words[w.key]={lv:0,next:todayStr(),learned:todayStr(),correct:0,wrong:0};
    S.words[w.key].wrong++; S.words[w.key].lv=0; S.words[w.key].next=dateOffset(1);
    addPoints(1);
    markStudied(); petStudyReward(); saveState();
    if(learnQueue.filter(x=>x.key===w.key).length===1){ learnQueue.splice(learnIdx+1+Math.floor(Math.random()*2),0,{...w}); }
    // 显示记忆助手
    const emoji=EMOJI_MAP[w.en];
    document.getElementById("learnMemorize").innerHTML=`<div class="memorize-box">
      <div style="font-size:13px;color:#00B894;font-weight:700;margin-bottom:6px">📌 记住它</div>
      ${emoji?`<div style="font-size:40px">${emoji}</div>`:""}
      <div style="font-size:20px;font-weight:800;color:var(--primary)">${w.en}</div>
      <div style="font-size:16px;margin:4px 0">${w.cn}</div>
      <button class="speak-btn" style="margin-top:6px" onclick="speak('${w.en.replace(/'/g,"\\'")}')">🔊 再听一遍</button>
      <button class="big-btn" style="margin-top:12px" onclick="SFX.click();learnIdx++;showLearnCard()">记住了，下一题 →</button>
    </div>`;
    speak(w.en);
  }
}

function startTest(mode){
  const all=allWordsForGrade(S.grade);
  const learned=all.filter(w=>S.words[w.key]);
  if(mode==="choice"&&learned.length<4){ showToast("至少学习4个单词才能测试"); return; }
  if(!learned.length){ showToast("先学几个单词再来测试吧"); return; }
  testMode=mode;
  if(mode==="spell"){
    // 拼写只用单个单词(不含短语)，避免空格复杂度
    const wordOnly=learned.filter(w=>w.type==="word"&&w.en.length>=3&&w.en.length<=12);
    if(!wordOnly.length){ showToast("学过的单词太少，先去学习吧"); return; }
    testQuestions=shuffle(wordOnly).slice(0,10);
  } else {
    testQuestions=shuffle(learned).slice(0,10);
  }
  testIdx=0; testCorrect=0;
  showTestCard();
}
function showTestCard(){
  spellLocked=false;
  if(testIdx>=testQuestions.length){
    const rate=testCorrect/testQuestions.length;
    const pts=Math.round(testCorrect*5*(1+rate*0.5));
    let got=rate>=0.8?pts:rate>=0.6?Math.round(pts*0.6):Math.round(pts*0.3);
    addPoints(got);
    const emoji=rate>=0.9?"🏆":rate>=0.7?"🌟":rate>=0.5?"💪":"📖";
    const msg=rate>=0.9?"太厉害了，你是单词大王！":rate>=0.7?"很棒，继续保持！":rate>=0.5?"不错，再加油！":"没关系，多复习几遍就会了！";
    document.getElementById("testArea").innerHTML=`<div class="card" style="text-align:center;padding:30px 20px">
      <div style="font-size:56px;margin-bottom:12px">${emoji}</div>
      <div class="result-circle" style="background:linear-gradient(135deg,${rate>=0.6?"#6C5CE7,#A29BFE":"#E17055,#FAB1A0"})">${Math.round(rate*100)}%</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:6px">答对 ${testCorrect}/${testQuestions.length}</div>
      <div style="font-size:14px;color:var(--text-light);margin-bottom:8px">${msg}</div>
      <div class="result-points">+${got} 积分已到账</div>
      <button class="big-btn" onclick="SFX.click();startTest('${testMode}')">再测一次</button>
      <button class="big-btn secondary" onclick="SFX.click();switchPage('home')">返回首页</button></div>`;
    markStudied(); petStudyReward(); saveState();
    if(rate>=0.6) SFX.levelup(); else SFX.coin();
    return;
  }
  const w=testQuestions[testIdx];
  if(testMode==="choice"){
    const all=allWordsForGrade(S.grade);
    let options=[w];
    while(options.length<4){ const r=all[Math.floor(Math.random()*all.length)]; if(!options.find(o=>o.key===r.key)) options.push(r); }
    options=shuffle(options);
    const dir=Math.random()>0.4;
    document.getElementById("testArea").innerHTML=`
      <div style="text-align:center;font-size:13px;color:var(--text-light);margin-bottom:8px">第 ${testIdx+1}/${testQuestions.length} 题</div>
      <div class="card"><div class="quiz-type-tag">${dir?"选出正确的中文意思":"选出正确的英文"}</div>
      <div style="display:flex;align-items:center;justify-content:center;gap:10px">
        <div class="quiz-prompt" style="padding:16px 0">${dir?w.en:w.cn}</div>
        ${dir?`<button class="speak-btn" onclick="speak('${w.en.replace(/'/g,"\\'")}')">🔊</button>`:""}
      </div>
      <div id="testOptions">${options.map(o=>`<button class="quiz-option" onclick="testAnswer(this,'${o.key}','${w.key}',${dir})">${dir?o.cn:o.en}</button>`).join("")}</div></div>
      <div class="progress-track"><div class="progress-fill" style="width:${testIdx/testQuestions.length*100}%"></div></div>`;
    if(dir) setTimeout(()=>speak(w.en),300);
  } else {
    setupSpell(w);
  }
}
function testAnswer(btn, chosen, correctKey, dir){
  const opts=document.querySelectorAll("#testOptions .quiz-option");
  opts.forEach(o=>o.classList.add("disabled"));
  const isCorrect=chosen===correctKey;
  if(isCorrect){ btn.classList.add("correct"); testCorrect++; SFX.correct(); }
  else{
    btn.classList.add("wrong"); SFX.wrong();
    const cw=allWordsForGrade(S.grade).find(x=>x.key===correctKey);
    opts.forEach(o=>{ if(o.textContent===(dir?cw.cn:cw.en)) o.classList.add("correct"); });
    speak(cw.en);
  }
  recordAnswer(correctKey, isCorrect); saveState();
  setTimeout(()=>{ testIdx++; showTestCard(); }, isCorrect?500:1200);
}
// ---- 字母块拼写 ----
function setupSpell(w){
  spellTarget=w.en.toLowerCase();
  const letters=spellTarget.split("");
  // 干扰字母
  const alpha="abcdefghijklmnopqrstuvwxyz";
  const nExtra=Math.min(4,Math.max(2,Math.floor(letters.length/3)));
  const pool=[...letters];
  for(let i=0;i<nExtra;i++) pool.push(alpha[Math.floor(Math.random()*26)]);
  spellBank=shuffle(pool).map((ch,i)=>({ch,used:false,id:i}));
  spellSlots=new Array(letters.length).fill(null);
  drawSpell();
  setTimeout(()=>speak(w.en),300);
}
function drawSpell(){
  const w=testQuestions[testIdx];
  const slotsHtml=spellSlots.map((s,i)=>`<div class="spell-slot ${s?"filled":""}" onclick="spellSlotTap(${i})">${s?s.ch:""}</div>`).join("");
  const bankHtml=spellBank.map(t=>`<button class="letter-tile ${t.used?"used":""}" onclick="spellTileTap(${t.id})">${t.ch}</button>`).join("");
  document.getElementById("testArea").innerHTML=`
    <div style="text-align:center;font-size:13px;color:var(--text-light);margin-bottom:8px">第 ${testIdx+1}/${testQuestions.length} 题</div>
    <div class="card" style="text-align:center">
      <div class="quiz-type-tag">点选字母，拼出英文单词</div>
      <div style="display:flex;align-items:center;justify-content:center;gap:10px">
        <div class="quiz-prompt" style="font-size:24px;padding:12px 0">${w.cn}</div>
        <button class="speak-btn" onclick="speak('${w.en.replace(/'/g,"\\'")}')">🔊</button>
      </div>
      <div class="spell-slots" id="spellSlots">${slotsHtml}</div>
      <div class="letter-bank" id="spellBank">${bankHtml}</div>
      <div id="spellFeedback" style="margin-top:14px;font-size:14px;min-height:20px"></div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${testIdx/testQuestions.length*100}%"></div></div>`;
}
function spellTileTap(id){
  if(spellLocked) return;
  const t=spellBank[id];
  if(t.used) return;
  const idx=spellSlots.indexOf(null);
  if(idx===-1) return;
  t.used=true;
  spellSlots[idx]={ch:t.ch,id};
  SFX.pop();
  drawSpell();
  if(!spellSlots.includes(null)) setTimeout(checkSpellTiles,300);
}
function spellSlotTap(i){
  if(spellLocked) return;
  const s=spellSlots[i];
  if(!s) return;
  spellBank[s.id].used=false;
  spellSlots[i]=null;
  SFX.pop();
  drawSpell();
}
function checkSpellTiles(){
  if(spellLocked) return;
  spellLocked=true;
  const w=testQuestions[testIdx];
  const attempt=spellSlots.map(s=>s.ch).join("");
  const correct=attempt===spellTarget;
  // 标色
  const slotEls=document.querySelectorAll("#spellSlots .spell-slot");
  spellTarget.split("").forEach((ch,i)=>{ if(slotEls[i]) slotEls[i].classList.add(spellSlots[i].ch===ch?"ok":"bad"); });
  const fb=document.getElementById("spellFeedback");
  if(correct){
    testCorrect++; SFX.correct(); speak(w.en);
    fb.innerHTML=`<span style="color:var(--success);font-weight:700">✓ 拼对啦！</span>`;
  } else {
    SFX.wrong();
    fb.innerHTML=`<span style="color:var(--danger)">✗ 正确拼写：<b style="letter-spacing:2px">${w.en}</b></span>`;
    setTimeout(()=>speak(w.en),500);
  }
  recordAnswer(w.key,correct); saveState();
  setTimeout(()=>{ testIdx++; showTestCard(); }, correct?1100:1800);
}

// ==================== 单词本 ====================
let bookFilter="all";
function renderBook(){
  const all=allWordsForGrade(S.grade);
  const grades=[...new Set(all.map(w=>w.grade))];
  const filters=document.getElementById("bookFilters");
  filters.innerHTML=`<button class="filter-chip ${bookFilter==="all"?"active":""}" onclick="bookFilter='all';renderBook()">全部</button>
    <button class="filter-chip ${bookFilter==="mastered"?"active":""}" onclick="bookFilter='mastered';renderBook()">已掌握</button>
    <button class="filter-chip ${bookFilter==="learning"?"active":""}" onclick="bookFilter='learning';renderBook()">学习中</button>
    <button class="filter-chip ${bookFilter==="new"?"active":""}" onclick="bookFilter='new';renderBook()">未学习</button>`+
    grades.map(g=>`<button class="filter-chip ${bookFilter==="g"+g?"active":""}" onclick="bookFilter='g${g}';renderBook()">${g}年级</button>`).join("");
  const q=(document.getElementById("bookSearch").value||"").toLowerCase();
  let list=all.filter(w=>{
    if(q && !w.en.toLowerCase().includes(q) && !w.cn.includes(q)) return false;
    if(bookFilter==="all") return true;
    if(bookFilter==="mastered"||bookFilter==="learning"||bookFilter==="new") return wordStatus(w.key)===bookFilter;
    if(bookFilter.startsWith("g")) return w.grade===parseInt(bookFilter.slice(1));
    return true;
  });
  const container=document.getElementById("bookList");
  if(!list.length){ container.innerHTML=`<div style="text-align:center;padding:30px;color:var(--text-light)">没有匹配的单词</div>`; return; }
  container.innerHTML=list.slice(0,100).map(w=>{
    const st=wordStatus(w.key);
    const stLabel=st==="new"?"未学":st==="learning"?"学习中":"已掌握";
    return `<div class="wb-item"><div><div class="wb-word">${w.en} ${w.type==="phrase"?"<span style='font-size:11px;color:var(--primary)'>短语</span>":""}</div><div class="wb-mean">${w.cn}</div></div><span class="wb-status ${st}">${stLabel}</span></div>`;
  }).join("")+(list.length>100?`<div style="text-align:center;padding:12px;font-size:12px;color:var(--text-light)">还有 ${list.length-100} 个，请搜索缩小范围</div>`:"");
}

// ==================== 语法 ====================
let grammarFilter=3;
function renderGrammar(){
  const tabs=document.getElementById("grammarTabs");
  tabs.innerHTML=[3,4,5,6].map(g=>`<button class="tab-btn ${grammarFilter===g?"active":""}" onclick="grammarFilter=${g};renderGrammar()">${g}年级</button>`).join("");
  const list=GRAMMAR.filter(g=>g.g===grammarFilter);
  document.getElementById("grammarList").innerHTML=list.map((g,i)=>`
    <div class="card grammar-card" onclick="toggleGrammar(this)">
      <div class="grammar-title"><span class="grammar-tag">${g.tag}</span>${g.title}</div>
      <div class="grammar-body">${g.body}</div></div>`).join("")||`<div class="card" style="text-align:center;color:var(--text-light)">该年级语法知识整理中...</div>`;
}
function toggleGrammar(el){
  const body=el.querySelector(".grammar-body");
  body.classList.toggle("open");
}

// ==================== 宠物页 ====================
function showPetTab(tab, btn){
  document.querySelectorAll("#page-pet .tab-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("petMain").style.display=tab==="main"?"block":"none";
  document.getElementById("petShop").style.display=tab==="shop"?"block":"none";
  renderPet();
}
function renderPet(){
  petDecay();
  const p=S.pets;
  const main=document.getElementById("petMain");
  if(!p.owned.length){
    main.innerHTML=`<div class="card" style="text-align:center;padding:40px 20px"><div style="font-size:48px;margin-bottom:12px">🥚</div><div style="font-weight:700;margin-bottom:8px">你还没有宠物</div><div style="font-size:14px;color:var(--text-light)">去商店领养一只吧！</div></div>`;
  } else {
    const info=PET_SHOP.find(x=>x.id===p.active);
    const need=p.level*50;
    const isSad=p.hunger<20||p.mood<20;
    const idleAnim=isSad?"":"anim-sleep";
    main.innerHTML=`<div class="card"><div class="pet-stage">
      <div class="pet-emoji ${idleAnim}" onclick="petTouch()">${petEmoji()}</div>
      <div class="pet-name">${info?info.name:"宠物"} ${info?`<span style="font-size:11px;background:#F0EDFF;color:var(--primary);padding:2px 8px;border-radius:8px;vertical-align:middle">${info.tier}</span>`:""}</div>
      <div class="pet-level">Lv.${p.level} · 经验 ${p.exp}/${need}</div>
      <div class="pet-status-msg">${petStatusMsg()}</div></div>
      <div class="stat-row"><span class="stat-label">饱食</span><div class="stat-bar"><div class="stat-fill hunger" style="width:${p.hunger}%"></div></div><span class="stat-val">${Math.round(p.hunger)}</span></div>
      <div class="stat-row"><span class="stat-label">心情</span><div class="stat-bar"><div class="stat-fill mood" style="width:${p.mood}%"></div></div><span class="stat-val">${Math.round(p.mood)}</span></div>
      <div class="stat-row"><span class="stat-label">经验</span><div class="stat-bar"><div class="stat-fill" style="width:${p.exp/need*100}%;background:linear-gradient(90deg,#6C5CE7,#A29BFE)"></div></div><span class="stat-val">${Math.round(p.exp/need*100)}%</span></div>
      <div class="pet-actions">
        <button class="pet-action-btn feed" onclick="feedPet(10)" ${S.points<10?"disabled":""}>🍎 喂食<span class="cost">10积分 · 饱食+25</span></button>
        <button class="pet-action-btn play" onclick="playWithPet()">🎾 玩耍<span class="cost">免费 · 心情+15</span></button>
        <button class="pet-action-btn gift" onclick="giftPet()" ${S.points<20?"disabled":""}>🎁 礼物<span class="cost">20积分 · 心情+30</span></button>
      </div>
      <div style="margin-top:14px;font-size:12px;color:var(--text-light);text-align:center">每天背单词和复习都会自动喂养宠物哦~</div></div>`;
    if(p.owned.length>1){
      main.innerHTML+=`<div class="card"><div class="card-title">切换宠物</div><div style="display:flex;gap:12px;flex-wrap:wrap">`+
        p.owned.map(id=>{ const it=PET_SHOP.find(x=>x.id===id); return `<div style="text-align:center;cursor:pointer;padding:8px 14px;border-radius:12px;border:2px solid ${p.active===id?"var(--primary)":"#F1F2F6"}" onclick="SFX.click();S.pets.active='${id}';saveState();renderPet()"><div style="font-size:32px">${it.emoji}</div><div style="font-size:12px">${it.name}</div></div>`; }).join("")+`</div></div>`;
    }
  }
  // 商店
  const shop=document.getElementById("petShop");
  shop.innerHTML=`<div class="shop-grid">`+PET_SHOP.map(it=>{
    const owned=p.owned.includes(it.id);
    const canBuy=S.points>=it.price;
    return `<div class="shop-item ${owned?"owned":""}">
      <div style="font-size:10px;color:${it.tier==="神话"?"#E84393":it.tier==="传说"?"#6C5CE7":it.tier==="珍稀"?"#00B894":"#B2BEC3"};font-weight:700">${it.tier}${it.price>0?" · 需"+it.price+"积分":""}</div>
      <div class="shop-emoji">${owned?it.emoji:(canBuy?it.emoji:it.emoji)}</div>
      <div class="shop-name">${it.name}</div>
      <div style="font-size:11px;color:var(--text-light)">${it.desc}</div>
      <div class="shop-price">${it.price===0?"免费领养":"⭐ "+it.price+" 积分"}</div>
      ${owned?`<button class="shop-btn select" onclick="SFX.click();S.pets.active='${it.id}';saveState();renderPet();showToast('已切换到${it.name}')">${p.active===it.id?"当前":"选择"}</button>`
      :`<button class="shop-btn" onclick="buyPet('${it.id}')" ${canBuy?"":"disabled"}>${canBuy?"领养":"积分不足"}</button>`}</div>`;
  }).join("")+`</div>`;
}
function buyPet(id){
  const it=PET_SHOP.find(x=>x.id===id);
  if(S.points<it.price){ showToast("积分不够哦！"); SFX.wrong(); return; }
  S.points-=it.price;
  S.pets.owned.push(id);
  S.pets.active=id;
  S.pets.hunger=80; S.pets.mood=80;
  saveState(); updatePointsDisplay(); renderPet();
  SFX.levelup(); spawnParticles(["🎉","✨","💖","🌟"],6);
  showToast(`恭喜领养了${it.name}！好好照顾它吧~`);
}
function petTouch(){
  S.pets.mood=Math.min(100,S.pets.mood+2);
  saveState();
  SFX.pop();
  petAnim("anim-wiggle"); spawnParticles(["💕","😊"],2);
  renderPet();
  showToast(["摸摸头~","宠物蹭了蹭你的手","它看起来很开心！","咕噜咕噜~"][Math.floor(Math.random()*4)]);
}

// ==================== 设置 ====================
function renderSettings(){
  document.getElementById("dailyCount").textContent=S.dailyNew;
  document.getElementById("gradeDisplay").textContent=["三","四","五","六"][S.grade-3]+"年级";
  const all=allWordsForGrade(S.grade);
  const learned=all.filter(w=>S.words[w.key]).length;
  const mastered=all.filter(w=>wordStatus(w.key)==="mastered").length;
  let totalCorrect=0,totalWrong=0;
  Object.values(S.words).forEach(w=>{totalCorrect+=w.correct;totalWrong+=w.wrong;});
  document.getElementById("statsArea").innerHTML=`
    累计学习：${S.studyDays.length} 天<br>
    已学单词：${learned} / ${all.length}<br>
    已掌握：${mastered} 个<br>
    累计答题：${totalCorrect+totalWrong} 次（正确率 ${totalCorrect+totalWrong?Math.round(totalCorrect/(totalCorrect+totalWrong)*100):0}%）<br>
    累计获得积分：${S.totalPoints}<br>
    连续学习：${S.streak} 天`;
}
function adjDaily(d){ S.dailyNew=Math.max(3,Math.min(20,S.dailyNew+d)); saveState(); renderSettings(); }
function adjGrade(d){ S.grade=Math.max(3,Math.min(6,S.grade+d)); saveState(); renderSettings(); showToast("已切换到"+["三","四","五","六"][S.grade-3]+"年级词库"); }
function resetAll(){
  if(confirm("确定要重置所有学习数据吗？此操作不可恢复！")){
    localStorage.removeItem("wordpet_v1");
    S=defaultState();
    showSetup();
  }
}

// ==================== 初始化 ====================
function showSetup(){
  document.getElementById("setupOverlay").style.display="flex";
  const grid=document.getElementById("gradeGrid");
  grid.innerHTML=[3,4,5,6].map(g=>`<div class="grade-opt ${g===6?"active":""}" onclick="selectGrade(this,${g})">${g}年级</div>`).join("");
}
let setupGrade=6;
function selectGrade(el,g){
  document.querySelectorAll(".grade-opt").forEach(e=>e.classList.remove("active"));
  el.classList.add("active");
  setupGrade=g;
}
function finishSetup(){
  const name=document.getElementById("setupName").value.trim()||"小朋友";
  S.name=name; S.grade=setupGrade;
  saveState();
  document.getElementById("setupOverlay").style.display="none";
  showToast(`欢迎，${name}！开始今天的学习吧~`);
  renderHome();
}
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

// Boot
petDecay();
if(!S.name){ showSetup(); } else { document.getElementById("setupOverlay").style.display="none"; }
renderHome();
</script>
